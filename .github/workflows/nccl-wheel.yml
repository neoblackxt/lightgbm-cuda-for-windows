name: Build +nccl experimental wheel

# CI provenance for the experimental real-NCCL wheel (experiment/nccl-multigpu
# branch). Builds NCCL from NVIDIA's official source (provenance-verified
# against the pinned mirror commit), links LightGBM against it, and packages
# the +nccl wheel. Trigger: manual dispatch, or tags 'nccl-exp*' (which do NOT
# match the release workflow's 'v*' trigger).

on:
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: 'Release tag to attach/clobber the wheel onto (e.g. nccl-exp1); empty = artifact only'
        default: ''
  push:
    tags: ['nccl-exp*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # WyvernTKC/nccl-windows mirror pin (NVIDIA v2.32.3-1 + 6-commit delta).
  # The delta vs the official tag is verified in-job before anything is built.
  NCCL_MIRROR_SHA: '9edb3bdbf93442b78a2d5324af3b46bc69e4f078'
  NCCL_OFFICIAL_TAG: 'v2.32.3-1'
  NCCL_OFFICIAL_SHA: '12df1a11afad322be5a204a2db890161cbf8131d'
  NCCL_ARCHES: '75;80;86;89;120'
  CUDAARCHS: '75;80;86;89;120'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Activate MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore CUDA Toolkit cache
        id: cache-cuda
        uses: actions/cache/restore@v6
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3
          key: cuda-13.3.0-windows-x64-installed-v1

      - name: Install CUDA Toolkit 13.3
        if: steps.cache-cuda.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.0'
          method: local
          use-github-cache: false

      - name: Save CUDA Toolkit cache
        if: steps.cache-cuda.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3
          key: cuda-13.3.0-windows-x64-installed-v1
        continue-on-error: true

      - name: Set CUDA environment
        shell: pwsh
        run: |
          $cuda = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3"
          if (-not (Test-Path "$cuda\bin\nvcc.exe")) { throw "nvcc not found at $cuda" }
          echo "CUDA_PATH=$cuda" >> $env:GITHUB_ENV
          echo "$cuda\bin" >> $env:GITHUB_PATH

      - name: Fetch NCCL sources with provenance verification
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/WyvernTKC/nccl-windows nccl-src
          cd nccl-src
          head=$(git rev-parse HEAD)
          if [ "$head" != "$NCCL_MIRROR_SHA" ]; then
            echo "FAIL: mirror HEAD moved: $head (expected $NCCL_MIRROR_SHA)"
            exit 1
          fi
          git remote add nvidia https://github.com/NVIDIA/nccl
          git fetch --quiet --depth 1 nvidia "refs/tags/$NCCL_OFFICIAL_TAG"
          official=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [ "$official" != "$NCCL_OFFICIAL_SHA" ]; then
            echo "FAIL: official tag moved: $official (expected $NCCL_OFFICIAL_SHA)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$official" HEAD; then
            echo "FAIL: official $NCCL_OFFICIAL_TAG is not an ancestor of the mirror HEAD"
            exit 1
          fi
          # The mirror delta must be nonempty and touch only these exact paths.
          allowed=(
            README.md
            src/debug.cc
            src/device/symmetric/reduce_scatter.cuh
            src/group.cc
            src/include/sym_kernels.h
            src/os/windows.cc
            src/proxy.cc
          )
          git diff --name-only -z "$official" HEAD > delta-files.z
          delta_files=()
          while IFS= read -r -d '' path; do
            delta_files+=("$path")
          done < delta-files.z
          if [ "${#delta_files[@]}" -eq 0 ]; then
            echo "FAIL: mirror delta vs official $NCCL_OFFICIAL_TAG is empty"
            exit 1
          fi
          unexpected=()
          for path in "${delta_files[@]}"; do
            for allowed_path in "${allowed[@]}"; do
              if [ "$path" = "$allowed_path" ]; then
                continue 2
              fi
            done
            unexpected+=("$path")
          done
          if [ "${#unexpected[@]}" -gt 0 ]; then
            echo "FAIL: unexpected files in mirror delta:"
            printf '  %s\n' "${unexpected[@]}"
            exit 1
          fi
          echo "mirror delta vs official $NCCL_OFFICIAL_TAG verified (${#delta_files[@]} files, exact allowlist)"

      - name: Restore NCCL build cache
        id: cache-nccl
        uses: actions/cache/restore@v6
        with:
          path: install-nccl
          key: nccl-${{ env.NCCL_MIRROR_SHA }}-cuda13.3-${{ env.NCCL_ARCHES }}-v1

      - name: Build NCCL
        if: steps.cache-nccl.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Git Bash resolves link.exe to coreutils; CUDA try-compile needs MSVC.
          cmake -S nccl-src -B build-nccl -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="${NCCL_ARCHES}" \
            -DCMAKE_CUDA_COMPILER="$CUDA_PATH/bin/nvcc.exe" \
            -DCMAKE_LINKER:FILEPATH="${VCToolsInstallDir}bin/Hostx64/x64/link.exe" \
            -DCMAKE_INSTALL_PREFIX=install-nccl
          cmake --build build-nccl --parallel --target install

      - name: Save NCCL cache
        if: steps.cache-nccl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: install-nccl
          key: nccl-${{ env.NCCL_MIRROR_SHA }}-cuda13.3-${{ env.NCCL_ARCHES }}-v1
        continue-on-error: true

      - name: Build LightGBM wheel (real NCCL)
        shell: bash
        env:
          CMAKE_GENERATOR: Ninja
          SKBUILD_BUILD_DIR: ${{ github.workspace }}/build-lgbm-nccl
        run: |
          set -euo pipefail
          nccl_root="$PWD/install-nccl"
          for required in include/nccl.h lib/nccl.lib bin/nccl.dll; do
            if [ ! -f "$nccl_root/$required" ]; then
              echo "FAIL: missing NCCL install artifact: $nccl_root/$required"
              exit 1
            fi
          done
          # Native Windows CMake does not resolve Git Bash's /d/... paths.
          export NCCL_ROOT="$(cygpath -m "$nccl_root")"
          export CUDACXX="$CUDA_PATH/bin/nvcc.exe"
          python -m pip install --upgrade pip build scikit-build-core ninja
          sh build-python.sh bdist_wheel --cuda --no-isolation
          ls dist/

      - name: Inject nccl.dll and retag wheel to +nccl
        shell: bash
        run: |
          set -euo pipefail
          NCCL_DLL=install-nccl/bin/nccl.dll python scripts/nccl_wheel.py dist

      - name: Smoke test +nccl wheel
        shell: bash
        run: |
          set -euo pipefail
          if ! python -m pip install dist/lightgbm-*+nccl-*.whl; then
            echo "FAIL: could not install the +nccl wheel"
            exit 1
          fi
          if python - <<'PY'
          import os
          import sys
          import traceback

          def finish(code):
              sys.stdout.flush()
              sys.stderr.flush()
              # Bypass Python finalization so the shell receives the check result.
              os._exit(code)

          try:
              import ctypes
              from importlib.metadata import version
              from pathlib import Path
              import numpy as np
              import lightgbm as lgb

              assert version("lightgbm").endswith("+nccl"), version("lightgbm")
              dll = Path(lgb.basic._LIB._name)
              assert (dll.parent / "nccl.dll").is_file(), "nccl.dll missing from installed wheel"
              kernel32 = ctypes.WinDLL("kernel32", use_last_error=True)
              kernel32.GetModuleHandleW.argtypes = [ctypes.c_wchar_p]
              kernel32.GetModuleHandleW.restype = ctypes.c_void_p
              if not kernel32.GetModuleHandleW("nccl.dll"):
                  raise RuntimeError("lib_lightgbm.dll did not load nccl.dll; real NCCL was not linked")
              rng = np.random.RandomState(0)
              X = rng.randn(2000, 10).astype(np.float32)
              y = (X[:, 0] > 0).astype(np.int32)
              bst = lgb.train({"objective": "binary", "num_leaves": 15, "verbose": -1},
                              lgb.Dataset(X, label=y), num_boost_round=10)
              assert bst.predict(X[:10]).shape == (10,)
          except BaseException:
              traceback.print_exc()
              print("FAIL: +nccl wheel smoke test failed", file=sys.stderr)
              finish(1)

          print(f"LightGBM library: {dll}")
          print("CPU training, real-NCCL loading, and +nccl metadata/payload checks passed")
          finish(0)
          PY
          then
            echo "PASS: +nccl wheel smoke test exited 0"
          else
            status=$?
            echo "FAIL: +nccl wheel smoke test exited $status without a clean status"
            exit "$status"
          fi
          exit 0

      - uses: actions/upload-artifact@v7
        with:
          name: nccl-wheel
          path: dist/lightgbm-*+nccl-*.whl
          if-no-files-found: error
          compression-level: 0

      - name: Attach wheel to release (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.attach_to_release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.attach_to_release }}
        run: |
          gh release upload "$TAG" dist/lightgbm-*+nccl-*.whl --clobber
